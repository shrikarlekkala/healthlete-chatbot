name: Deploy Healthlete Chatbot

on:
  push:
    branches:
      - Production
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: healthlete-chatbot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AI EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Debug OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC subject:', payload.sub);
            
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973429899719:role/healthlete-prod-github-actions-role
          aws-region: us-east-2

      - name: Deploy application using SSM
        env:
          INSTANCE_ID: i-067eb9e96eea2a00a
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/ssm-parameters.json <<'JSON'
          {
            "commands": [
              "set -e", "export HOME=/home/ubuntu", 
              "cd /var/www/healthlete-stream-chatbot",
              "git config --global --add safe.directory /var/www/healthlete-stream-chatbot", "git fetch origin Production", "git reset --hard origin/Production", "sudo -u ubuntu -H /var/www/healthlete-stream-chatbot/venv/bin/python -m pip install -r /var/www/healthlete-stream-chatbot/requirements.txt", "sudo -u ubuntu -H bash -c 'cd /var/www/healthlete-stream-chatbot && pm2 restart start'", "sudo -u ubuntu -H bash -c 'pm2 save'", "sudo -u ubuntu -H bash -c 'pm2 status'" ]
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Healthlete chatbot" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment status polling timed out."
          exit 1

