name: Deploy Healthlete Chatbot

on:
  push:
    branches:
      - Production
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: healthlete-chatbot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AI EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Debug OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC subject:', payload.sub);
            
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy application using SSM
        env:
          INSTANCE_ID: i-067eb9e96eea2a00a
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Healthlete chatbot" \
            --parameters 'commands=[
              "set -e",
              "cd /var/www/healthlete-stream-chatbot",
              "git fetch origin Production",
              "git reset --hard origin/Production",
              "source venv/bin/activate",
              "python -m pip install -r requirements.txt",
              "pm2 restart start",
              "pm2 save",
              "pm2 status"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment status polling timed out."
          exit 1
