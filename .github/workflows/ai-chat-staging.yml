name: Deploy Healthlete Chatbot

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: healthlete-chatbot-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
            
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::973429899719:role/healthlete-staging-github-actions-role
          aws-region: us-east-2

      
      - name: Deploy application using SSM
        env:
          INSTANCE_ID: i-0e6d537e950ac27f4
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(jq -nc '{
            commands: [
              "set -e",
              "export HOME=/home/ubuntu",
              "cd /var/www/html/healthlete-chatbot",
              "git config --global --add safe.directory /var/www/html/healthlete-chatbot",
              "git fetch origin staging",
              "git reset --hard origin/staging",
              "sudo -u ubuntu -H /var/www/html/healthlete-chatbot/venv/bin/python -m pip install -r /var/www/html/healthlete-chatbot/requirements.txt",
              "sudo -u ubuntu -H bash -c \"cd /var/www/html/healthlete-chatbot && pm2 restart healthlete-aichatbot\"",
              "sudo -u ubuntu -H bash -c \"pm2 save\"",
              "sudo -u ubuntu -H bash -c \"pm2 status\""
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Healthlete chatbot" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment status polling timed out."
          exit 1
